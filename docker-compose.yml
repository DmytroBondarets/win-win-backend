services:
  postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  auth-api:
    build:
      context: ./auth-api
      dockerfile: Dockerfile
    container_name: auth-api
    depends_on:
      - postgres
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/authdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      JWT_SECRET: changeme-super-secret-key-1234567890
      DATA_API_URL: http://data-api:8081
      INTERNAL_TOKEN: winwin-internal-secret
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    networks:
      - app-network

  data-api:
    build:
      context: ./data-api
      dockerfile: Dockerfile
    container_name: data-api
    environment:
      SERVER_PORT: 8081
      INTERNAL_TOKEN: winwin-internal-secret
    ports:
      - "8081:8081"
    networks:
      - app-network

volumes:
  postgres_data:
    name: auth-api_postgres_data

networks:
  app-network:
    driver: bridge
